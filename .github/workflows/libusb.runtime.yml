name: libusb.runtime
on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  ContinuousIntegrationBuild: true
  VersionSuffix: ${{github.event_name != 'release' && format('ci.{0}', github.run_number) || ''}}
  LIBUSB_URL: https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z
  LIBUSB_SHA256: 19835e290f46fab6bd8ce4be6ab7dc5209f1c04bad177065df485e51dc4118c8
jobs:
  build:
    name: Build and pack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Set release version
        if: github.event_name == 'release'
        run: echo "Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download libusb
        shell: bash
        run: |
          mkdir -p libusb
          curl --fail --silent --show-error --location --output "libusb/$(basename "$LIBUSB_URL")" "$LIBUSB_URL"
          echo "$LIBUSB_SHA256 libusb/$(basename "$LIBUSB_URL")" | sha256sum --check --strict
          7z x -y -olibusb "libusb/$(basename "$LIBUSB_URL")" > /dev/null
          echo "LibUsbDirectory=$GITHUB_WORKSPACE/libusb" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore src/libusb.runtime

      - name: Build
        run: dotnet build src/libusb.runtime --no-restore --configuration release

      - name: Pack
        id: pack
        run: dotnet pack src/libusb.runtime --no-restore --no-build --configuration release

      - name: Collect NuGet packages
        uses: actions/upload-artifact@v7
        if: steps.pack.outcome == 'success' && always()
        with:
          name: Packages
          if-no-files-found: error
          path: artifacts/package/release/**

  publish-github:
    name: Publish packages to GitHub
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      packages: write
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: artifacts/packages/

      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/packages/*.nupkg" --skip-duplicate --no-symbols --api-key ${{secrets.GITHUB_TOKEN}} --source https://nuget.pkg.github.com/${{github.repository_owner}}

  publish-packages-nuget-org:
    name: Publish packages to NuGet.org
    runs-on: ubuntu-latest
    environment: public-release
    needs: build
    if: github.event_name == 'release'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: artifacts/packages/

      - name: Upload release assets
        run: gh release upload --repo ${{github.repository}} ${{github.event.release.tag_name}} artifacts/packages/* --clobber
        env:
          GH_TOKEN: ${{github.token}}

      - name: Log in to NuGet.org with OIDC
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{secrets.NUGET_USER}}

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} --source ${{vars.NUGET_API_URL}}
