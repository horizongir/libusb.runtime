name: libusb.runtime
on:
  push:
    branches: ['**']
  pull_request:
  release:
    types: [published]
env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false
  ContinuousIntegrationBuild: true
  VersionSuffix: ${{github.event_name != 'release' && format('ci.{0}', github.run_number) || ''}}
  LIBUSB_BINARIES_URL: https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.7z
  LIBUSB_BINARIES_SHA256: 19835e290f46fab6bd8ce4be6ab7dc5209f1c04bad177065df485e51dc4118c8
  LIBUSB_SOURCE_URL: https://github.com/libusb/libusb/releases/download/v1.0.27/libusb-1.0.27.tar.bz2
  LIBUSB_SOURCE_SHA256: ffaa41d741a8a3bee244ac8e54a72ea05bf2879663c098c82fc5757853441575
jobs:
  build-macos:
    name: Build ${{matrix.rid}}
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            rid: osx-arm64
            deployment-target: '11.0'
          - os: macos-15-intel
            rid: osx-x64
            deployment-target: '10.15'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build libusb
        run: bash scripts/build-libusb-macos.sh ${{matrix.deployment-target}} artifacts/native/${{matrix.rid}}

      - name: Collect native library
        uses: actions/upload-artifact@v7
        with:
          name: libusb-${{matrix.rid}}
          if-no-files-found: error
          path: artifacts/native/${{matrix.rid}}/libusb-1.0.dylib

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: build-macos
    env:
      LibUsbMacOSDirectory: ${{github.workspace}}/libusb-macos
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Set release version
        if: github.event_name == 'release'
        run: echo "Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download Windows binaries
        shell: bash
        run: |
          mkdir -p libusb
          curl --fail --silent --show-error --location --output "libusb/$(basename "$LIBUSB_BINARIES_URL")" "$LIBUSB_BINARIES_URL"
          echo "$LIBUSB_BINARIES_SHA256 libusb/$(basename "$LIBUSB_BINARIES_URL")" | sha256sum --check --strict
          7z x -y -olibusb "libusb/$(basename "$LIBUSB_BINARIES_URL")" > /dev/null
          echo "LibUsbDirectory=$GITHUB_WORKSPACE/libusb" >> "$GITHUB_ENV"

      - name: Download macOS binaries
        uses: actions/download-artifact@v8
        with:
          pattern: libusb-osx-*
          path: libusb-macos

      - name: Pack
        id: pack
        run: dotnet pack src/libusb.runtime --configuration release

      - name: Collect NuGet packages
        uses: actions/upload-artifact@v7
        if: steps.pack.outcome == 'success' && always()
        with:
          name: Packages
          if-no-files-found: error
          path: artifacts/package/release/**

  test:
    name: Test ${{matrix.rid}}
    runs-on: ${{matrix.os}}
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: artifacts/package/release

      - name: Run portable app
        run: dotnet run --project tests/libusb.runtime.Consumer --configuration release

      - name: Publish self-contained app
        run: dotnet publish tests/libusb.runtime.Consumer --configuration release --runtime ${{matrix.rid}} --self-contained --output artifacts/consumer/${{matrix.rid}}

      - name: Run self-contained app
        shell: bash
        run: artifacts/consumer/${{matrix.rid}}/libusb.runtime.Consumer

  publish-github:
    name: Publish packages to GitHub
    runs-on: ubuntu-latest
    needs: [pack, test]
    if: github.event_name == 'push'
    permissions:
      packages: write
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: artifacts/packages/

      - name: Push to GitHub Packages
        run: dotnet nuget push "artifacts/packages/*.nupkg" --skip-duplicate --no-symbols --api-key ${{secrets.GITHUB_TOKEN}} --source https://nuget.pkg.github.com/${{github.repository_owner}}

  publish-packages-nuget-org:
    name: Publish packages to NuGet.org
    runs-on: ubuntu-latest
    environment: public-release
    needs: [pack, test]
    if: github.event_name == 'release'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: artifacts/packages/

      - name: Upload release assets
        run: gh release upload --repo ${{github.repository}} ${{github.event.release.tag_name}} artifacts/packages/* --clobber
        env:
          GH_TOKEN: ${{github.token}}

      - name: Log in to NuGet.org with OIDC
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{secrets.NUGET_USER}}

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/packages/*.nupkg" --api-key ${{steps.nuget-login.outputs.NUGET_API_KEY}} --source ${{vars.NUGET_API_URL}}
